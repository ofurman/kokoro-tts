[project]
name = "kokoro-mcp"
version = "0.1.0"
description = "Local Kokoro-82M text-to-speech: stream speech to the speakers or save WAV files"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "kokoro>=0.9.4,<0.10",
    # PortAudio output for speaker streaming; the macOS wheel bundles PortAudio.
    "sounddevice>=0.5.6",
    # misaki's English G2P loads this spaCy model; declaring it avoids a
    # runtime pip install into the venv on first synthesis.
    "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
]

[project.scripts]
kokoro-tts = "kokoro_mcp.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kokoro_mcp"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: runs the real Kokoro-82M model, downloads weights on first use",
]
addopts = "-m 'not integration'"
